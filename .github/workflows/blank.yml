name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # falls du Submodule nutzt, sonst egal

      - name: Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: make -j$(nproc)

      - name: Build-Ergebnis hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/            # an dein Output-Verzeichnis anpassen
          if-no-files-found: warn
