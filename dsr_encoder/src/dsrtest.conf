
; dsrtest.conf - Test signal generator for dsrtx
;
; Fills all 16 DSR stereo channels (ITU-R BO.712-1, 32 kHz / 16:14-bit audio
; per channel) with deterministic sine-tone test signals and renders exactly
; 30 seconds of modulated I/Q to a file. No network/ffmpeg sources are used,
; so this file is fully offline and reproducible - useful to verify a build,
; a decoder, or a full RF chain without depending on any external stream.
;
; Run with:
;   ./dsrtx -c dsrtest.conf
; The process exits on its own after 30 seconds (see "duration" below,
; a small addition on top of upstream dsrtx which otherwise runs until
; interrupted). At 20.48 Msps int16 I/Q the resulting file is:
;   20480000 * 30s * 2 (I/Q) * 2 bytes = ~2.29 GiB

verbose = true

[output]
type = file
output = dsrtest.iq
data_type = int16		; Modulated QPSK I/Q, 16-bit signed interleaved I/Q
sample_rate = 20480000		; 2x DSR_SYMBOL_RATE, or any other multiple of 10240000
duration = 30			; Stop after 30 seconds of audio (500 blocks/sec x 30s)

; -----------------------------------------------------------------------
; Channel plan
;
; The 16 tones below are chosen to exercise different aspects of the DSR
; signal path rather than to sound pleasant:
;
;  1  1000 Hz  0.5   Reference/alignment tone (standard broadcast level ref)
;  2   400 Hz  0.5   Secondary alignment tone
;  3  3150 Hz  0.3   Standard distortion/SNR measurement tone
;  4    40 Hz  0.3   Low-frequency / bass response edge
;  5   100 Hz  0.3   Low-mid frequency
;  6   630 Hz  0.3   Mid-band frequency
;  7  2000 Hz  0.3   Upper-mid frequency
;  8  6300 Hz  0.3   High frequency
;  9  A: 330 Hz / B: 1200 Hz, 0.1  Independent mono A/B pair (see mode=a/b)
; 10 10000 Hz  0.3   High frequency, approaching Nyquist (16 kHz @ 32 kHz)
; 11 15000 Hz  0.2   Near top-of-band, close to Nyquist - aliasing/HF check
; 12  1000 Hz  0.95  Near full-scale tone - headroom/clipping check
; 13  1000 Hz  0.01  Near-silent tone - low-level/noise-floor check
; 14     0 Hz  0.0   True silence - idle-channel handling check
; 15 music     0.3   Procedural 80s-style chiptune (type=music)
; 16 noise     0.3   Deterministic white noise (type=noise)
; -----------------------------------------------------------------------

[channel]
channel = 1
name = "REF 1K"
program_type = 0
type = tone
frequency = 1000
level = 0.5

[channel]
channel = 2
name = "REF400"
program_type = 0
type = tone
frequency = 400
level = 0.5

[channel]
channel = 3
name = "DIST3K1"
program_type = 0
type = tone
frequency = 3150
level = 0.3

[channel]
channel = 4
name = "BASS40"
program_type = 0
type = tone
frequency = 40
level = 0.3

[channel]
channel = 5
name = "LOW100"
program_type = 0
type = tone
frequency = 100
level = 0.3

[channel]
channel = 6
name = "MID630"
program_type = 0
type = tone
frequency = 630
level = 0.3

[channel]
channel = 7
name = "MID2K"
program_type = 0
type = tone
frequency = 2000
level = 0.3

[channel]
channel = 8
name = "HI6K3"
program_type = 0
type = tone
frequency = 6300
level = 0.3

; Channel 9 is split into two independent mono programmes (A/B) to
; demonstrate that mono channel pairing works independently of the
; stereo (mode=s) path used by every other channel in this file.

[channel]
channel = 9
mode = a
name = "MONO A"
program_type = 0
type = tone
frequency = 330
level = 0.1

[channel]
channel = 9
mode = b
name = "MONO B"
program_type = 0
type = tone
frequency = 1200
level = 0.1

[channel]
channel = 10
name = "HI10K"
program_type = 0
type = tone
frequency = 10000
level = 0.3

[channel]
channel = 11
name = "HI15K"
program_type = 0
type = tone
frequency = 15000
level = 0.2

[channel]
channel = 12
name = "HOTFULL"
program_type = 0
type = tone
frequency = 1000
level = 0.95

[channel]
channel = 13
name = "QUIET"
program_type = 0
type = tone
frequency = 1000
level = 0.01

[channel]
channel = 14
name = "SILENCE"
program_type = 0
type = tone
frequency = 0
level = 0

[channel]
channel = 15
name = "CHIPTUNE"
program_type = 10
type = music
level = 0.3

[channel]
channel = 16
name = "NOISE"
program_type = 0
type = noise
level = 0.3
seed = 1

; Available program types:
;
; No | Program type                   | Short term
;  0 | No programme type or undefined |
;  1 | News                           | NEWS
;  2 | Current affairs                | AFFAIRS
;  3 | Information                    | INFO
;  4 | Sport                          | SPORT
;  5 | Education                      | EDUCATE
;  6 | Drama                          | DRAMA
;  7 | Culture                        | CULTURES
;  8 | Science                        | SCIENCE
;  9 | Varied                         | VARIED
; 10 | Pop music                      | POP M
; 11 | Rock music                     | ROCK M
; 12 | M.O.R. music                   | M.O.R. M
; 13 | Light classical                | LIGHT M
; 14 | Serious classical              | CLASSICS
; 15 | Other music                    | OTHER M
