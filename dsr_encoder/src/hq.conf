; DSR "HQ-Mux": Lossless- und High-Bitrate-Quellen zur Demonstration
; der Audioqualität des Systems.
;
; Kanal 1-14: verlustfreie FLAC-Streams (16 bit / 44,1-48 kHz,
;             SR P2 sogar 24 bit / 48 kHz)
; Kanal 15-16: Radio France "hifi" AAC 192 kbit/s
;
; Alle Streams am 2026-10-05 mit ffprobe geprüft.
;
; Hinweis: Kein "level"-Eintrag => Standard 1.0, d.h. src_ffmpeg skaliert
; nicht nach – das Signal geht nach dem Resampling auf 32 kHz / 16 bit
; unverändert in den Encoder. Lossless-Quellen sind meist nicht
; lautheitsoptimiert, daher können die Pegel zwischen Kanälen variieren.

; Enable verbose output (defaults to false)
verbose = true

; Only one output may be defined each time

;[output]
;type = hackrf		; Output to a hackrf
;frequency = 855e6	; Transmit on 855MHz
;sample_rate = 20480000	; Or 10240000, but signal quality may suffer
;gain = 47		; Control the TX gain
;amp = false		; Control the TX amplifier (default false)

[output]
type = socket		; Network: UDP (unmod_udp) or TCP P2P (unmod_tcp + tcp://…)
output = udp://127.0.0.1:5000
data_type = unmod_udp	; uint8|int8|uint16|int16|int32|float|unmod_uint8|unmod_udp|unmod_tcp
sample_rate = 20480000	; Or any multiple of 10240000


