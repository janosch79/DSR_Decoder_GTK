
; Example configuration file for dsrtx.

; Enable verbose output (defaults to false)
verbose = true

; Only one output may be defined each time

;[output]
;type = hackrf		; Output to a hackrf
;frequency = 855e6	; Transmit on 855MHz
;sample_rate = 20480000	; Or 10240000, but signal quality may suffer
;gain = 47		; Control the TX gain
;amp = false		; Control the TX amplifier (default false)

;[output]
;type = socket		; UDP/TCP network output (see dsrtx --help)
;output = udp://127.0.0.1:5000
;data_type = unmod_udp	; uint8|int8|uint16|int16|int32|float|unmod_uint8|unmod_udp|unmod_tcp
;sample_rate = 20480000	; Or any multiple of 10240000
  
;[output]
;type = file		; Output to a file as raw stream (uint16)
;output = signalraw.iq	; Write to "signal.iq"
;data_type = unmod_uint8	; uint8|int8|uint16|int16|int32|float|unmod_uint8|unmod_udp
;sample_rate = 20480000	; Or any multiple of 10240000


[output]
;type = file		; Output to a file as raw stream (uint16)
;output = signalf32.iq	; Write to "signal.iq"
;data_type = float	; uint8|int8|uint16|int16|int32|float|unmod_uint8|unmod_udp
;sample_rate = 20480000	; Or any multiple of 10240000

;UDP Output
; Für einen einzelnen Client: udp://127.0.0.1:5000 (oder spezifische IP)
; Für mehrere Clients: udp://255.255.255.255:5000 (Broadcast)
;                       oder udp://192.168.1.255:5000 (Netzwerk-Broadcast)

[output]
type = socket		; UDP (unmod_udp) or e.g. tcp://… with unmod_tcp for P2P
output = udp://127.0.0.1:5000	; Einzelner Client (oder 255.255.255.255 für Broadcast)
data_type = unmod_udp	; uint8|int8|uint16|int16|int32|float|unmod_uint8|unmod_udp|unmod_tcp
sample_rate = 20480000;20480000	; Or any multiple of 10240000

; Channel 1 reads from a raw 16-bit 32 kHz stereo audio file

[channel]
channel = 1		; This is channel 1 (out of 16)
name = " DSR!!!"	; Set the display name, up to 8 characters
program_type = 10	; Set the program type (10 = Pop music)
frequency = 660		; Set the tone to 330 Hz
level = 0.1		; Audio level is 0.1

; Channel 2 is a 330 Hz test tone (Stereo)

[channel]
channel = 2		; This is channel 2
name = TEST330
type = tone		; Generate a test tone
frequency = 330		; Set the tone to 330 Hz
level = 0.1		; Audio level is 0.1

; Channel 3A is a 440 Hz test tone (Mono)

[channel]
channel = 3		; This is channel 3
mode = a		; Mono A
name = TEST440
type = tone
frequency = 440
level = 0.1

; Channel 3B is a 1000 Hz test tone (Mono)

[channel]
channel = 3		; Mono channels are still numbered 1-16
mode = b		; Mono B
name = TEST1000
type = tone
frequency = 1000
level = 0.1

; Channel 4 streams BBC Radio 1 using ffmpeg to fetch and resample

[channel]
channel = 4		; This is channel 2
name = TEST2000
type = tone		; Generate a test tone
frequency = 2000		; Set the tone to 330 Hz
level = 0.1		; Audio level is 0.1

; Available program types:
;
; No | Program type                   | Short term
;  0 | No programme type or undefined | 
;  1 | News                           | NEWS
;  2 | Current affairs                | AFFAIRS
;  3 | Information                    | INFO
;  4 | Sport                          | SPORT
;  5 | Education                      | EDUCATE
;  6 | Drama                          | DRAMA
;  7 | Culture                        | CULTURES
;  8 | Science                        | SCIENCE
;  9 | Varied                         | VARIED
; 10 | Pop music                      | POP M
; 11 | Rock music                     | ROCK M
; 12 | M.O.R. music                   | M.O.R. M
; 13 | Light classical                | LIGHT M
; 14 | Serious classical              | CLASSICS
; 15 | Other music                    | OTHER M

